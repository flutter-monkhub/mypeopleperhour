<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1D4A" />
    <meta name="description" content="MyPeopleHour & PCBL Mentoring Programme — admin panel for HR, programme admins and leadership." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MyPeopleHour Admin · PCBL</title>
    <style>
      /* Boot splash — shown until the store has hydrated (see src/main.tsx) */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F6F8FC; font-family: Inter, system-ui, sans-serif; color: #475569; font-size: 13px; }
      #boot .ring { width: 34px; height: 34px; border-radius: 999px; border: 3px solid #E5E9F2; border-top-color: #2F56E8; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="ring"></div>Loading MyPeopleHour Admin…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
